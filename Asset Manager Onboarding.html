<!doctype html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <title>Asset Manager Onboarding</title>
  <link rel="stylesheet" href="colors_and_type.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://kit.fontawesome.com/a08997c4a1.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="fontawesome-pro-local.css" />
  <style>
    html, body { margin:0; padding:0; color: rgb(249,250,251); min-height:100vh; font-family: Inter, sans-serif; }
    body {
      background-color: rgb(11,21,36);
      background-image:
        radial-gradient(ellipse 60% 80% at 75% 10%, rgba(12, 90, 82, 0.30) 0%, rgba(10, 70, 70, 0.12) 28%, transparent 55%),
        radial-gradient(ellipse 60% 80% at 20% 85%, rgba(10, 70, 70, 0.10) 0%, transparent 55%),
        linear-gradient(135deg, rgb(10, 20, 34) 0%, rgb(11, 22, 36) 50%, rgb(9, 18, 30) 100%);
      background-attachment: fixed;
    }
    a { color: rgb(52,211,153); text-decoration: none; }
    a:hover { color: rgb(110,231,183); }
    @keyframes obSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes obFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .dp-dropzone:hover { border-color: rgb(16,185,129) !important; background: rgba(16,185,129,0.05) !important; }
    .ob-cta:hover { opacity: 0.88; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(75,85,99,0.5); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(107,114,128,0.7); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="datapacks-data.jsx"></script>
  <script type="text/babel" src="onboarding.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<OnboardingApp />);
  </script>
</body>
</html>
