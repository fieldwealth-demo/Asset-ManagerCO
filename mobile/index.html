/* Field mobile: one dark Field canvas (the product is dark-only), a phone-width
   column that runs edge to edge on a phone and sits centred on a desktop.
   Layout: floating app bar (Field mark · Ask/Brief/Review · new chat), roomy
   reading column, composer pinned to the bottom on Ask only. */
:root {
  color-scheme: dark;
  --bg: rgb(11, 21, 36);
  --bg-raise: rgb(17, 29, 47);
  --bg-float: rgba(24, 37, 57, 0.82);
  --card: rgba(255, 255, 255, 0.035);
  --card-hi: rgba(255, 255, 255, 0.07);
  --line: rgba(107, 114, 128, 0.38);
  --line-soft: rgba(107, 114, 128, 0.22);
  --text: rgb(249, 250, 251);
  --text-2: rgb(218, 222, 229);
  --muted: rgb(163, 171, 183);
  --faint: rgb(140, 149, 162);
  --green: rgb(52, 211, 153);
  --green-fill: rgb(16, 185, 129);
  --green-ink: rgb(4, 30, 20);
  --green-wash: rgba(16, 185, 129, 0.15);
  --green-line: rgba(52, 211, 153, 0.42);
  --amber: rgb(251, 191, 36);
  --red: rgb(248, 113, 113);
  --blue: rgb(96, 165, 250);
  --purple: rgb(167, 139, 250);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --col: 480px;
  --gut: 20px;
  --bar-h: 76px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: rgb(8, 15, 27);
  background-image:
    radial-gradient(ellipse 60% 50% at 50% 0%, rgba(12, 90, 82, 0.28) 0%, transparent 60%),
    radial-gradient(ellipse 70% 60% at 15% 95%, rgba(10, 70, 70, 0.14) 0%, transparent 55%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.g { color: var(--green); } .r { color: var(--red); } .m { color: var(--muted); } .b { color: var(--blue); } .w { color: var(--text); }
.hidden { display: none !important; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

/* ---------- column + app bar ---------- */
.app {
  max-width: var(--col); margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  background: linear-gradient(180deg, rgba(12, 60, 58, 0.2) 0, transparent 320px), var(--bg);
  position: relative;
}
@media (min-width: 540px) {
  .app { border-left: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); box-shadow: 0 0 80px rgba(0, 0, 0, 0.45); }
}
.gutter { padding-left: max(var(--gut), env(safe-area-inset-left, 0px)); padding-right: max(var(--gut), env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }

.appbar {
  position: sticky; top: var(--safe-t); z-index: 20; height: var(--bar-h);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 62%, rgba(11, 21, 36, 0) 100%);
}
.round-btn {
  position: relative; width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
  border: 1px solid var(--line-soft); background: var(--bg-float); color: var(--text-2);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display: inline-flex; align-items: center; justify-content: center; font-size: 17px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
}
.round-btn:active { background: var(--card-hi); }
.round-btn:disabled { color: rgba(163, 171, 183, 0.4); cursor: default; }
.round-btn.brand { color: var(--green); }
.round-btn .badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--green-fill); color: var(--green-ink); font-size: 10.5px; font-weight: 800; line-height: 18px; text-align: center; }
.switch {
  display: flex; padding: 4px; gap: 2px; border-radius: 99px; min-width: 0;
  background: var(--bg-float); border: 1px solid var(--line-soft);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
}
.switch button {
  border: 0; background: transparent; color: var(--text-2); border-radius: 99px;
  min-height: 40px; padding: 0 clamp(12px, 4.2vw, 20px); font-size: 15.5px; font-weight: 500; white-space: nowrap;
}
.switch button.on { background: var(--green-wash); color: var(--green); font-weight: 650; box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.3); }
.app-main { padding-bottom: calc(40px + var(--safe-b)); }

/* ---------- shared bits ---------- */
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.icon-btn {
  position: relative; width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent;
  color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; flex-shrink: 0;
}
.icon-btn:active { background: var(--card-hi); }
.icon-btn.sm { width: 40px; height: 40px; font-size: 15px; }
.icon-btn.on { color: var(--green); }
.pill { flex-shrink: 0; display: inline-flex; align-items: center; font-size: 13px; font-weight: 700; padding: 3px 11px; border-radius: 99px; border: 1px solid; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.5; }
.pill-sm { font-size: 12.5px; padding: 2px 10px; }
.pill-g { color: var(--green); background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.42); }
.pill-a { color: var(--amber); background: rgba(251, 191, 36, 0.12); border-color: rgba(251, 191, 36, 0.42); }
.pill-r { color: var(--red); background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.42); }
.pill-b { color: var(--blue); background: rgba(96, 165, 250, 0.12); border-color: rgba(96, 165, 250, 0.42); }
.pill-p { color: var(--purple); background: rgba(167, 139, 250, 0.12); border-color: rgba(167, 139, 250, 0.42); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; }
.card.pad { padding: 20px; }
.card.list > * + * { border-top: 1px solid var(--line-soft); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.sub { font-size: 14px; color: var(--muted); line-height: 1.45; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 13px; color: var(--text-2); background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line-soft); border-radius: 8px; padding: 3px 10px; line-height: 1.5; }
.btn {
  min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
  color: var(--text); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 9px; text-decoration: none;
}
.btn:active { background: var(--card-hi); }
.btn-primary { background: var(--green-fill); border-color: var(--green-fill); color: var(--green-ink); }
.btn-primary:active { background: rgb(5, 150, 105); }
.btn:disabled { opacity: 0.45; cursor: default; }
.link-btn { border: 0; background: transparent; color: var(--green); font-size: 15px; font-weight: 600; padding: 10px 0; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; min-height: 44px; }
.hi-g { color: var(--green); font-weight: 600; }
.hi-a { color: var(--amber); font-weight: 600; }
.tl { border: 0; background: none; padding: 0; color: var(--text); font-weight: 600; text-decoration: underline; text-decoration-color: rgba(52, 211, 153, 0.55); text-underline-offset: 4px; text-decoration-thickness: 1.5px; text-align: left; font-size: inherit; line-height: inherit; }
.tl:active { color: var(--green); }
.tl-strong { text-decoration: none; font-size: 18px; font-weight: 650; display: inline-flex; align-items: center; gap: 8px; min-height: 30px; line-height: 1.3; letter-spacing: -0.01em; }
.tl-strong .tl-chev { font-size: 12px; color: var(--green); }
.tl-plain-strong { font-size: 18px; font-weight: 650; }
.seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line-soft); }
.seg-full { display: flex; width: 100%; }
.seg button { flex: 1; min-height: 42px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: var(--text-2); font-size: 14.5px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
.seg button.on { background: var(--green-wash); color: var(--green); font-weight: 650; box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.3); }
.chip-scroll { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(var(--gut) * -1); padding: 2px var(--gut); scroll-padding: var(--gut); }
.chip-scroll::-webkit-scrollbar { display: none; }
.sec-head { margin: 52px 0 16px; }
.sec-head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-head h2 { margin: 0; font-size: 23px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.sec-note { margin: 6px 0 0; font-size: 15px; color: var(--muted); line-height: 1.55; }
.conf { display: inline-flex; align-items: center; gap: 8px; }
.conf-track { width: 44px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.conf-track > span { display: block; height: 100%; border-radius: 3px; }
.conf b { font-variant-numeric: tabular-nums; color: var(--text); }
.toast {
  position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(min(100vw, var(--col)) - 40px);
  bottom: calc(var(--safe-b) + 120px); z-index: 90;
  padding: 12px 18px; border-radius: 14px; background: rgb(30, 41, 59); border: 1px solid var(--line); color: var(--text); font-size: 15px; font-weight: 500;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); opacity: 0; transform: translateY(8px); transition: opacity .18s, transform .18s; pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }
.avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: rgb(11, 18, 32); font-weight: 700; flex-shrink: 0; letter-spacing: 0.02em; }
.avatar.ring { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--green-fill); }

/* ---------- drawer (Field mark → recent chats) ---------- */
.drawer-wrap { position: fixed; top: 0; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: var(--col); overflow: hidden; z-index: 70; pointer-events: none; visibility: hidden; transition: visibility 0s linear .28s; }
.drawer-wrap.open { pointer-events: auto; visibility: visible; transition: visibility 0s; }
.drawer-scrim { position: absolute; inset: 0; background: rgba(3, 8, 16, 0.62); opacity: 0; transition: opacity .22s; }
.drawer-wrap.open .drawer-scrim { opacity: 1; }
.drawer {
  position: absolute; top: 0; bottom: 0; left: 0; width: min(86%, 380px);
  background: var(--bg-raise); border-right: 1px solid var(--line);
  padding: calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 16px) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 8px;
  transform: translateX(-104%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
}
.drawer-wrap.open .drawer { transform: none; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 0 0 10px 6px; }
.drawer-brand { display: inline-flex; align-items: center; gap: 10px; color: var(--green); }
.drawer-brand b { color: var(--text); font-size: 20px; letter-spacing: -0.01em; }
.drawer .round-btn { box-shadow: none; width: 44px; height: 44px; }
.drawer-new { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.drawer-new .fa { color: var(--green); }
.drawer-new:disabled { opacity: 0.5; }
.drawer-label { margin: 18px 6px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.drawer-empty { margin: 4px 6px; color: var(--muted); font-size: 15px; line-height: 1.55; }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; min-height: 0; }
.hist-row { width: 100%; text-align: left; padding: 13px 12px; border-radius: 12px; border: 0; background: transparent; color: var(--text-2); font-size: 15.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hist-row:active { background: var(--card-hi); }
.hist-row.cur { background: var(--green-wash); color: var(--text); }
.drawer-me { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 14px 6px 0; border-top: 1px solid var(--line-soft); }
.drawer-me div { display: flex; flex-direction: column; line-height: 1.35; }
.drawer-me b { font-size: 15px; }
.drawer-me span { font-size: 13px; color: var(--muted); }

/* ---------- sheet ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 80; pointer-events: none; }
.sheet-wrap.open { pointer-events: auto; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(3, 8, 16, 0.6); opacity: 0; transition: opacity .2s; }
.sheet-wrap.open .sheet-scrim { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: var(--col); max-height: 82vh; display: flex; flex-direction: column;
  background: var(--bg-raise); border: 1px solid var(--line); border-bottom: 0; border-radius: 26px 26px 0 0;
  padding: 8px max(var(--gut), env(safe-area-inset-right, 0px)) calc(20px + var(--safe-b)) max(var(--gut), env(safe-area-inset-left, 0px));
  transform: translateY(102%); transition: transform .26s cubic-bezier(.2, .8, .2, 1);
}
.sheet-wrap.open .sheet { transform: none; }
.sheet-grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(163, 171, 183, 0.4); margin: 4px auto 8px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 4px; }
.sheet-head h3 { margin: 0; font-size: 19px; }
.sheet-body { overflow-y: auto; padding-top: 4px; }
.more-list { display: flex; flex-direction: column; }
.more-q { display: flex; gap: 16px; align-items: flex-start; text-align: left; border: 0; background: transparent; color: var(--text); padding: 15px 4px; font-size: 16px; line-height: 1.45; border-bottom: 1px solid var(--line-soft); }
.more-q .fa { width: 22px; flex-shrink: 0; margin-top: 4px; color: var(--green); font-size: 15px; text-align: center; }
.more-q.muted { color: var(--muted); border-bottom: 0; }
.more-q.muted .fa { color: var(--muted); }

/* ---------- Ask Field ---------- */
.ask-empty {
  min-height: calc(100vh - var(--bar-h) - var(--safe-t) - var(--safe-b) - 112px);
  min-height: calc(100dvh - var(--bar-h) - var(--safe-t) - var(--safe-b) - 112px);
  display: flex; flex-direction: column; justify-content: space-between; gap: 40px; padding-top: 6vh; padding-bottom: 140px;
}
.ask-hello { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.hello-mark { width: 52px; height: 52px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; color: var(--green); background: linear-gradient(140deg, rgba(16, 185, 129, 0.24), rgba(16, 185, 129, 0.05)); border: 1px solid var(--green-line); }
.hero-h { margin: 6px 0 0; font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
.hero-p { margin: 0; color: var(--muted); font-size: 18px; line-height: 1.5; max-width: 26ch; }
.suggest-list { display: flex; flex-direction: column; gap: 2px; }
.suggest-row {
  width: 100%; display: flex; align-items: flex-start; gap: 16px; text-align: left; padding: 14px 4px;
  border: 0; border-radius: 14px; background: transparent; color: var(--text-2); font-size: 17px; line-height: 1.45;
}
.suggest-row:active { background: var(--card-hi); }
.suggest-ic { width: 20px; margin-top: 4px; color: var(--green); font-size: 16px; text-align: center; flex-shrink: 0; }
.chip-q {
  flex-shrink: 0; max-width: 260px; text-align: left; padding: 10px 16px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--bg-float); color: var(--text-2); font-size: 14.5px; line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.chip-q:active { border-color: var(--green-line); color: var(--text); }

.thread { padding-top: 8px; padding-bottom: 220px; display: flex; flex-direction: column; gap: 36px; }
.msg-u { display: flex; justify-content: flex-end; scroll-margin-top: 92px; }
.bubble {
  max-width: 84%; padding: 13px 18px; border-radius: 24px 24px 8px 24px; font-size: 17px; line-height: 1.5;
  background: rgba(16, 185, 129, 0.17); border: 1px solid rgba(52, 211, 153, 0.28); color: var(--text);
  animation: rise .22s ease-out both; overflow-wrap: anywhere;
}
.msg-a { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.msg-a-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px; }
.glyph { width: 30px; height: 30px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--green); background: rgba(16, 185, 129, 0.14); border: 1px solid var(--green-line); }
.glyph.pulse { animation: pulse 1.4s ease-in-out infinite; }
.src { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); border: 1px solid var(--line-soft); border-radius: 99px; padding: 3px 11px; max-width: 100%; }
.src .fa { color: var(--green); font-size: 11px; }
.thinking { display: flex; flex-direction: column; gap: 12px; padding: 2px 0 2px 2px; }
.think-step { display: flex; align-items: center; gap: 12px; font-size: 16px; color: var(--muted); animation: rise .2s ease-out both; }
.think-step .fa { width: 16px; font-size: 13px; }
.think-step.done .fa { color: var(--green); }
.think-step.cur { color: var(--text-2); }
.shimmer { background: linear-gradient(90deg, var(--muted) 0%, var(--text) 40%, var(--muted) 80%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite; }
.thought { align-self: flex-start; border: 0; background: transparent; padding: 4px 0; margin: -6px 0; color: var(--faint); font-size: 14px; display: inline-flex; align-items: center; gap: 8px; min-height: 36px; }
.thought .fa { font-size: 11px; }
.thought-list { list-style: none; margin: -6px 0 0; padding: 12px 14px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; color: var(--muted); }
.thought-list .fa { color: var(--green); margin-right: 10px; font-size: 12px; }
.ans-summary { margin: 0; font-size: 18px; line-height: 1.65; color: var(--text-2); }
.ans-summary b, .ans-summary strong { color: var(--text); font-weight: 650; }
.caret { display: inline-block; width: 9px; height: 19px; margin-left: 3px; vertical-align: -3px; border-radius: 2px; background: var(--green); animation: blink 1s steps(1) infinite; }
.ans-list { display: flex; flex-direction: column; gap: 14px; }
.ans-item {
  padding: 20px; border-radius: 22px; background: var(--card); border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 12px; animation: rise .28s ease-out both;
}
.ans-list.static .ans-item { animation: none; }
.ans-sig { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 700; }
.ans-sig .fa { font-size: 13px; }
.ans-item-top { display: flex; align-items: flex-start; gap: 12px; }
.rank { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; background: var(--green-fill); color: var(--green-ink); font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
.ans-item-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ans-body { margin: 0; font-size: 16px; line-height: 1.6; color: var(--text-2); }
.ans-body b, .ans-body strong { color: var(--green); font-weight: 600; }
.mini-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; padding: 14px 0; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
.mini-stats div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mini-stats span { font-size: 11.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
.mini-stats b { font-size: 17px; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.insights { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }
.insight { display: flex; gap: 14px; align-items: flex-start; }
.insight-ic { width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
.insight-t { font-size: 16.5px; font-weight: 600; color: var(--text); line-height: 1.4; }
.insight-b { font-size: 15.5px; color: var(--muted); line-height: 1.6; margin-top: 3px; }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; }
.msg-actions { display: flex; gap: 4px; margin: -6px 0 0 -10px; }
.stopped { font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 9px; }
.fallback-list { display: flex; flex-direction: column; gap: 4px; }
.fallback-list .suggest-row { font-size: 16px; padding: 12px 4px; }
.fallback-list .fa { color: var(--green); margin-top: 5px; }
.lift { border: 1px solid var(--line); border-radius: 22px; background: var(--card); padding: 6px 20px; }
.lift-head, .lift-row { display: grid; grid-template-columns: minmax(0, 1fr) 34px 52px; gap: 12px; align-items: center; }
.lift-head { padding: 12px 0 10px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--line-soft); }
.lift-head span:nth-child(n+2) { text-align: right; }
.lift-row { padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
.lift-row:last-child { border-bottom: 0; }

/* ---------- Brief & Review ---------- */

.bar { height: 10px; border-radius: 5px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }

/* ---------- FA/Team profile ---------- */
